[project]
name = "ha-kocom-rs485"
version = "0.0.0"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-homeassistant-custom-component==0.13.373",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
